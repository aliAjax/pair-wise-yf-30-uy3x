<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>药物警戒案例台</title>
<style>body{font:15px system-ui;max-width:1080px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#172033}section{background:white;padding:20px;margin:16px 0;border-radius:12px;box-shadow:0 2px 12px #0001}input,textarea,button{font:inherit;padding:8px;margin:4px}input,textarea{width:70%}button{background:#174ea6;color:white;border:0;border-radius:6px}button.danger{background:#b3261e}pre{background:#111827;color:#d1fae5;padding:14px;overflow:auto}.ok{color:#1a7f37}.bad{color:#b3261e}</style>
<h1>药物警戒案例台</h1><p>标准库 JSON API 概览。请求需带 X-User-Id、X-Role；区域角色还需 X-Region。</p>
<section><h2>快速查看</h2><input id="user" value="global-admin"><input id="role" value="global_admin"><input id="region" placeholder="区域（如 CN）" value=""><button onclick="load()">刷新案例</button><pre id="out"></pre></section>
<section><h2>审计链校验与修复</h2><p>输入案例编号校验审计链连续性；发现断链或分叉时整案自动进入待核查。修复仅全局管理员可执行，且必须写明原因。</p>
<input id="chain-case-id" placeholder="案例 ID" value="1"><button onclick="checkChain()">校验审计链</button><button class="danger" onclick="repairChain()">修复审计链（全局管理员）</button>
<input id="repair-reason" placeholder="修复原因（必填）" style="width:60%"><pre id="chain-out"></pre></section>
<script>
function headers(){let h={'X-User-Id':user.value,'X-Role':role.value};if(region.value)h['X-Region']=region.value;return h}
async function load(){let r=await fetch('/api/state',{headers:headers()});out.textContent=JSON.stringify(await r.json(),null,2)}
async function checkChain(){let id=document.getElementById('chain-case-id').value;let r=await fetch('/api/cases/'+id+'/audit-chain',{headers:headers()});let d=await r.json();chain-out.textContent=JSON.stringify(d,null,2);chain-out.className=d.valid?'ok':'bad'}
async function repairChain(){let id=document.getElementById('chain-case-id').value;let r=await fetch('/api/cases/'+id+'/audit-repair',{method:'POST',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({reason:document.getElementById('repair-reason').value})});chain-out.textContent=JSON.stringify(await r.json(),null,2)}
load()
</script>
